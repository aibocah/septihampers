<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hampers Lebaran</title>
<link rel="stylesheet" href="assets/css/style.css">

<style>
/* ===== THEME COLOR ===== */
:root{
  --green:#2f7d6d;
  --green-soft:#e9f3ef;
  --cream:#fffaf2;
  --text:#2b2b2b;
}

/* ===== HOME LAYOUT ===== */
body{
  margin:0;
  background:var(--cream);
  color:var(--text);
}

.home-lebaran{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===== HEADER ===== */
.hero-lebaran{
  background:var(--green-soft);
  text-align:center;
  padding:28px 18px 18px;
  border-bottom-left-radius:28px;
  border-bottom-right-radius:28px;
}

.hero-lebaran h1{
  font-size:32px;
  margin:0;
  color:var(--green);
  letter-spacing:.6px;
}

.hero-lebaran h2{
  font-size:14px;
  font-weight:normal;
  margin:8px 0 6px;
}

.hero-lebaran p{
  font-size:12px;
  color:#555;
  margin:0;
}

/* ===== GRID BODY ===== */
<section class="grid-lebaran">

  <div class="item" data-link="produk/hampers-hemat.html">
    <div class="thumb">
      <img src="assets/img/hampers-1.jpg" alt="Hampers Hemat">
    </div>
  </div>

  <div class="item" data-link="produk/hampers-lengkap.html">
    <div class="thumb">
      <img src="assets/img/hampers-2.jpg" alt="Hampers Lengkap">
    </div>
  </div>

  <div class="item" data-link="produk/hampers-spesial.html">
    <div class="thumb">
      <img src="assets/img/hampers-3.jpg" alt="Hampers Spesial">
    </div>
  </div>

  <div class="item" data-link="produk/custom.html">
    <div class="thumb">
      <img src="assets/img/hampers-4.jpg" alt="Custom Hampers">
    </div>
  </div>

</section>

/* ===== FLOAT ACTION ===== */
.fab{
  position:fixed;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:12px;
  z-index:20;
}

.fab a{
  background:var(--green);
  color:#fff;
  padding:10px 18px;
  border-radius:24px;
  font-size:12px;
  text-decoration:none;
  box-shadow:0 6px 16px rgba(0,0,0,.2);
}

/* ===== FOOTER ===== */
.footer-lebaran{
  text-align:center;
  font-size:11px;
  padding:8px;
  opacity:.75;
}

.footer-lebaran a{
  margin:0 6px;
  text-decoration:none;
  color:var(--green);
}

/* ===== ZOOM OVERLAY ===== */
#zoomOverlay{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99;
}

#zoomOverlay img{
  max-width:100%;
  max-height:100%;
}
</style>
</head>

<body>

<div class="home-lebaran">

<!-- HEADER -->
<header class="hero-lebaran">
  <h1>Hampers Lebaran</h1>
  <h2>Temukan dan pilih hampers untuk keluarga dan teman anda</h2>
  <p>Pilihan ekonomis tanpa bikin krisis di moment Ramadhan tahun ini</p>
</header>

<!-- GRID PRODUK -->
<section class="grid-lebaran">
  <div class="item" data-link="produk/hampers-hemat.html">
    <img src="assets/img/hampers-1.jpg" alt="Hampers Hemat">
  </div>
  <div class="item" data-link="produk/hampers-lengkap.html">
    <img src="assets/img/hampers-2.jpg" alt="Hampers Lengkap">
  </div>
  <div class="item" data-link="produk/hampers-spesial.html">
    <img src="assets/img/hampers-3.jpg" alt="Hampers Spesial">
  </div>
  <div class="item" data-link="produk/custom.html">
    <img src="assets/img/hampers-4.jpg" alt="Custom Hampers">
  </div>
</section>

<!-- FLOAT BUTTON -->
<div class="fab">
  <a href="produk/hampers-hemat.html">Produk</a>
  <a href="produk/custom.html">Custom</a>
  <a href="https://wa.me/62895339847320">WA</a>
</div>

<!-- FOOTER -->
<footer class="footer-lebaran">
  Pilihlah pilihan yang tepat untuk kerabat anda <br>
  <a href="LINK_MAPS">Maps</a> •
  <a href="https://wa.me/62895339847320">WhatsApp</a> •
  <a href="LINK_TIKTOK">TikTok</a>
</footer>

</div>

<!-- ZOOM -->
<div id="zoomOverlay">
  <img id="zoomImg">
</div>

<script>
const items = document.querySelectorAll('.grid-lebaran .item');
const overlay = document.getElementById('zoomOverlay');
const zoomImg = document.getElementById('zoomImg');
let targetLink = '';

items.forEach(item => {
  item.addEventListener('click', () => {
    targetLink = item.dataset.link;
    zoomImg.src = item.querySelector('img').src;
    overlay.style.display = 'flex';
  });
});

overlay.addEventListener('click', () => {
  if(targetLink) window.location.href = targetLink;
});
</script>

</body>
</html>
