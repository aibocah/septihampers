<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hampers Lebaran</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="home">

<section class="grid">
  <div class="card-img" data-link="produk/hampers-hemat.html">
    <img src="assets/img/hampers-1.jpg">
  </div>
  <div class="card-img" data-link="produk/hampers-lengkap.html">
    <img src="assets/img/hampers-2.jpg">
  </div>
  <div class="card-img" data-link="produk/hampers-spesial.html">
    <img src="assets/img/hampers-3.jpg">
  </div>
  <div class="card-img" data-link="produk/custom.html">
    <img src="assets/img/hampers-4.jpg">
  </div>
</section>

<div id="overlay">
  <img id="overlayImg">
</div>

<script>
const cards = document.querySelectorAll('.card-img');
let lastTap = 0;

cards.forEach(card => {
  card.onclick = () => {
    const now = new Date().getTime();
    if (now - lastTap < 300) {
      window.location.href = card.dataset.link;
    } else {
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('overlayImg').src = card.querySelector('img').src;
    }
    lastTap = now;
  }
});

document.getElementById('overlay').onclick = () => {
  document.getElementById('overlay').style.display = 'none';
};
</script>

</body>
</html>
