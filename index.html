<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hampers Lebaran</title>
<link rel="stylesheet" href="assets/css/style.css">

<style>
/* ===== HOME FINAL (EXTRA MINIMAL) ===== */
.home-final{
min-height:100vh;
display:flex;
flex-direction:column;
background:#f9f7f2;
}

/* HEADER DOMINAN */
.hero-final{
text-align:center;
padding:24px 16px 14px;
}
.hero-final h1{
font-size:30px;
margin:0;
letter-spacing:.6px;
}
.hero-final h2{
font-size:13px;
font-weight:normal;
margin:6px 0 4px;
color:#444;
}
.hero-final p{
font-size:12px;
color:#666;
margin:0;
}

/* GRID BODY (KECIL & LEGA) */
.grid-final{
flex:1;
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
padding:18px 24px;
}
.grid-final .item{
height:100px;
border-radius:20px;
overflow:hidden;
background:#ddd;
}
.grid-final img{
width:100%;
height:100%;
object-fit:cover;
}

/* ZOOM OVERLAY */
#zoomOverlay{
position:fixed;
inset:0;
background:#000;
display:none;
align-items:center;
justify-content:center;
z-index:99;
}
#zoomOverlay img{
max-width:100%;
max-height:100%;
}

/* FLOAT ACTION */
.fab{
position:fixed;
bottom:14px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:12px;
z-index:20;
}
.fab a{
background:#1b7f5c;
color:#fff;
padding:10px 18px;
border-radius:24px;
font-size:12px;
text-decoration:none;
box-shadow:0 4px 10px rgba(0,0,0,.2);
}

/* FOOTER RINGKAS */
.footer-final{
text-align:center;
font-size:11px;
padding:6px;
opacity:.7;
}
.footer-final a{
margin:0 6px;
text-decoration:none;
}
</style>
</head>

<body class="home-final">

<!-- HEADER -->
<header class="hero-final">
  <h1>Hampers Lebaran</h1>
  <h2>Temukan dan pilih hampers untuk keluarga dan teman anda</h2>
  <p>Pilihan ekonomis tanpa bikin krisis di moment Ramadhan tahun ini</p>
</header>

<!-- GRID BODY -->
<section class="grid-final">
  <div class="item" data-link="produk/hampers-hemat.html">
    <img src="assets/img/hampers-1.jpg" alt="Hampers Hemat">
  </div>
  <div class="item" data-link="produk/hampers-lengkap.html">
    <img src="assets/img/hampers-2.jpg" alt="Hampers Lengkap">
  </div>
  <div class="item" data-link="produk/hampers-spesial.html">
    <img src="assets/img/hampers-3.jpg" alt="Hampers Spesial">
  </div>
  <div class="item" data-link="produk/custom.html">
    <img src="assets/img/hampers-4.jpg" alt="Custom Hampers">
  </div>
</section>

<!-- FLOAT ACTION -->
<div class="fab">
  <a href="produk/hampers-hemat.html">Produk</a>
  <a href="produk/custom.html">Custom</a>
  <a href="https://wa.me/62895339847320">WA</a>
</div>

<!-- FOOTER -->
<footer class="footer-final">
  Pilihlah pilihan yang tepat untuk kerabat anda <br>
  <a href="LINK_MAPS">Maps</a> •
  <a href="https://wa.me/62895339847320">WhatsApp</a> •
  <a href="LINK_TIKTOK">TikTok</a>
</footer>

<!-- ZOOM -->
<div id="zoomOverlay">
  <img id="zoomImg">
</div>

<script>
const items = document.querySelectorAll('.grid-final .item');
const overlay = document.getElementById('zoomOverlay');
const zoomImg = document.getElementById('zoomImg');
let targetLink = '';

items.forEach(item => {
  item.addEventListener('click', () => {
    targetLink = item.dataset.link;
    zoomImg.src = item.querySelector('img').src;
    overlay.style.display = 'flex';
  });
});

overlay.addEventListener('click', () => {
  if (targetLink) window.location.href = targetLink;
});
</script>

</body>
</html>
