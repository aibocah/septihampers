<script>
  const cards = document.querySelectorAll('.img-card');

  cards.forEach(card => {
    let zoomed = false;

    card.addEventListener('click', () => {
      if (!zoomed) {
        // klik pertama → zoom
        card.classList.add('zoom');
        zoomed = true;
      } else {
        // klik kedua → ke produk
        window.location.href = card.dataset.link;
      }
    });
  });
</script>
