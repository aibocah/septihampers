<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hampers Lebaran</title>
<link rel="stylesheet" href="assets/css/style.css">

<style>
/* ===== HOME COMBO B + C (REFINED) ===== */
.home-combo{
min-height:100vh;
display:flex;
flex-direction:column;
background:#f9f7f2;
}

/* HERO */
.hero-combo{
text-align:center;
padding:14px 12px 8px;
}
.hero-combo img{
width:60px;
height:60px;
border-radius:16px;
object-fit:cover;
margin-bottom:6px;
}
.hero-combo h1{font-size:19px;margin:4px 0}
.hero-combo h2{font-size:12px;font-weight:normal;margin:2px 0}
.hero-combo p{font-size:11px;color:#555;margin:4px 0}

/* GRID DIPERKECIL */
.grid-combo{
flex:1;
display:grid;
grid-template-columns:1fr 1fr;
grid-template-rows:1fr 1fr;
gap:10px;
padding:14px;
}
.grid-combo .item{
border-radius:20px;
overflow:hidden;
background:#eee;
}
.grid-combo img{
width:100%;
height:100%;
object-fit:cover;
}

/* OVERLAY ZOOM */
#zoomOverlay{
position:fixed;
inset:0;
background:#000;
display:none;
align-items:center;
justify-content:center;
z-index:99;
}
#zoomOverlay img{
max-width:100%;
max-height:100%;
}

/* FLOAT ACTION */
.fab{
position:fixed;
bottom:14px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:10px;
z-index:20;
}
.fab a{
background:#1b7f5c;
color:#fff;
padding:10px 16px;
border-radius:22px;
font-size:12px;
text-decoration:none;
box-shadow:0 4px 10px rgba(0,0,0,.2);
}

/* FOOTER */
.footer-combo{
text-align:center;
font-size:11px;
padding:6px;
opacity:.7;
}
.footer-combo a{margin:0 6px;text-decoration:none}
</style>
</head>

<body class="home-combo">

<!-- HERO -->
<header class="hero-combo">
  <img src="assets/img/hampers-1.jpg" alt="Hampers">
  <h1>Hampers Lebaran</h1>
  <h2>Temukan dan pilih hampers untuk keluarga dan teman anda</h2>
  <p>Pilihan ekonomis tanpa bikin krisis di moment Ramadhan tahun ini</p>
</header>

<!-- GRID -->
<section class="grid-combo">
  <div class="item" data-link="produk/hampers-hemat.html">
    <img src="assets/img/hampers-1.jpg">
  </div>
  <div class="item" data-link="produk/hampers-lengkap.html">
    <img src="assets/img/hampers-2.jpg">
  </div>
  <div class="item" data-link="produk/hampers-spesial.html">
    <img src="assets/img/hampers-3.jpg">
  </div>
  <div class="item" data-link="produk/custom.html">
    <img src="assets/img/hampers-4.jpg">
  </div>
</section>

<!-- FLOAT ACTION -->
<div class="fab">
  <a href="produk/hampers-hemat.html">Produk</a>
  <a href="produk/custom.html">Custom</a>
  <a href="https://wa.me/62895339847320">WA</a>
</div>

<!-- FOOTER -->
<footer class="footer-combo">
  Pilihlah pilihan yang tepat untuk kerabat anda <br>
  <a href="LINK_MAPS">Maps</a> •
  <a href="https://wa.me/62895339847320">WhatsApp</a> •
  <a href="LINK_TIKTOK">TikTok</a>
</footer>

<!-- ZOOM OVERLAY -->
<div id="zoomOverlay">
  <img id="zoomImg">
</div>

<script>
const items = document.querySelectorAll('.grid-combo .item');
const overlay = document.getElementById('zoomOverlay');
const zoomImg = document.getElementById('zoomImg');
let activeLink = '';

items.forEach(item => {
  item.addEventListener('click', () => {
    activeLink = item.dataset.link;
    zoomImg.src = item.querySelector('img').src;
    overlay.style.display = 'flex';
  });
});

overlay.addEventListener('click', () => {
  if (activeLink) {
    window.location.href = activeLink;
  }
});
</script>

</body>
</html>
