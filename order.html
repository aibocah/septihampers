<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Pemesanan Hampers Lebaran</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f7f2;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #1b7f5c, #2ea87b);
      color: white;
      padding: 20px;
      text-align: center;
    }

    section {
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #1b7f5c;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16694c;
    }

    .note {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>Form Pemesanan</h1>
  <p>Hampers Lebaran Murah</p>
</header>

<section>
  <div class="card">

    <label>Nama Lengkap *</label>
    <input type="text" id="nama" placeholder="Nama Anda">

    <label>Nomor WhatsApp *</label>
    <input type="tel" id="hp" placeholder="08xxxxxxxxxx">

    <label>Alamat Lengkap *</label>
    <textarea id="alamat" rows="3" placeholder="Alamat pengiriman"></textarea>

    <label>Detail Pesanan *</label>
    <textarea id="pesanan" rows="4" placeholder="Contoh: Custom hampers isi susu, gula, beras"></textarea>

    <label>Catatan Tambahan (Opsional)</label>
    <textarea id="catatan" rows="2" placeholder="Jika ada pesan tambahan"></textarea>

    <button onclick="kirimWA()">Pesan via WhatsApp</button>

    <p class="note">* Semua kolom bertanda wajib diisi</p>

  </div>
</section>

<script>
  function kirimWA() {
    const nama = document.getElementById("nama").value.trim();
    const hp = document.getElementById("hp").value.trim();
    const alamat = document.getElementById("alamat").value.trim();
    const pesanan = document.getElementById("pesanan").value.trim();
    const catatan = document.getElementById("catatan").value.trim();

    if (!nama || !hp || !alamat || !pesanan) {
      alert("Mohon lengkapi semua data wajib.");
      return;
    }

    let pesan =
      "Halo, saya ingin memesan Hampers Lebaran.%0A%0A" +
      "Nama: " + nama + "%0A" +
      "No HP: " + hp + "%0A" +
      "Alamat: " + alamat + "%0A%0A" +
      "Detail Pesanan:%0A" + pesanan;

    if (catatan) {
      pesan += "%0A%0ACatatan Tambahan:%0A" + catatan;
    }

    const nomorWA = "62895339847320";
    window.location.href = "https://wa.me/" + nomorWA + "?text=" + pesan;
  }
</script>

</body>
</html>
