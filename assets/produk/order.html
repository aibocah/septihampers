<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Pemesanan</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f0e6;
  padding:20px;
}
.container{
  max-width:420px;
  margin:auto;
  background:#fff;
  border-radius:24px;
  padding:20px;
  box-shadow:0 8px 16px rgba(0,0,0,.15);
}
h2{
  text-align:center;
  margin-bottom:20px;
}
label{
  font-weight:bold;
  display:block;
  margin-top:14px;
}
input, textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:14px;
  border:1px solid #ccc;
  font-size:14px;
}
textarea{
  resize:none;
}
button{
  width:100%;
  margin-top:22px;
  padding:16px;
  font-size:18px;
  font-weight:bold;
  border:none;
  border-radius:20px;
  background:#6fd68c;
  cursor:pointer;
}
.product-box{
  background:#eaf7ef;
  padding:14px;
  border-radius:16px;
  margin-bottom:16px;
}
</style>
</head>

<body>

<div class="container">

  <h2>Form Pemesanan</h2>

  <div class="product-box">
    <div><b>Produk:</b> <span id="produk"></span></div>
    <div><b>Harga:</b> Rp <span id="harga"></span></div>
  </div>

  <label>Nama Lengkap</label>
  <input type="text" id="nama" placeholder="Nama pembeli">

  <label>Nomor WhatsApp</label>
  <input type="tel" id="wa" placeholder="08xxxxxxxxxx">

  <label>Alamat Lengkap</label>
  <textarea id="alamat" rows="3" placeholder="Alamat pengiriman"></textarea>

  <label>Catatan (opsional)</label>
  <textarea id="catatan" rows="2" placeholder="Catatan tambahan"></textarea>

  <button onclick="kirimWA()">Pesan via WhatsApp</button>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const produk = params.get("produk") || "-";
const harga = params.get("harga") || "-";

document.getElementById("produk").innerText = produk;
document.getElementById("harga").innerText = harga;

function kirimWA(){
  const nama = document.getElementById("nama").value;
  const wa = document.getElementById("wa").value;
  const alamat = document.getElementById("alamat").value;
  const catatan = document.getElementById("catatan").value;

  const noAdmin = "6281234567890"; // GANTI NOMOR WA TOKO

  const pesan =
`Halo, saya ingin memesan:

Produk: ${produk}
Harga: Rp ${harga}

Nama: ${nama}
No WA: ${wa}
Alamat: ${alamat}
Catatan: ${catatan}

Terima kasih`;

  const url = `https://wa.me/${noAdmin}?text=${encodeURIComponent(pesan)}`;
  window.open(url, "_blank");
}
</script>

</body>
</html>
