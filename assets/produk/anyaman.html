<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Pemesanan</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f0e6;
  padding:20px;
}
.container{
  max-width:420px;
  margin:auto;
  background:#fff;
  border-radius:24px;
  padding:20px;
  box-shadow:0 8px 16px rgba(0,0,0,.15);
}
h2{
  text-align:center;
  margin-bottom:16px;
}
.notice{
  background:#fff3cd;
  padding:14px;
  border-radius:14px;
  font-size:14px;
  margin-bottom:16px;
}
.product-box{
  background:#eaf7ef;
  padding:14px;
  border-radius:16px;
  margin-bottom:16px;
}
label{
  font-weight:bold;
  display:block;
  margin-top:14px;
}
input, textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:14px;
  border:1px solid #ccc;
}
button{
  width:100%;
  margin-top:22px;
  padding:16px;
  font-size:18px;
  font-weight:bold;
  border:none;
  border-radius:20px;
  background:#6fd68c;
}
</style>
</head>

<body>

<div class="container">

  <h2>Form Pemesanan</h2>

  <div class="notice">
    Mohon lengkapi data diri terlebih dahulu agar pesanan dapat diproses dengan baik.
  </div>

  <div class="product-box">
    <b>Produk:</b> <span id="produk"></span><br>
    <b>Harga:</b> Rp <span id="harga"></span>
  </div>

  <label>Nama Lengkap</label>
  <input id="nama" placeholder="Nama pembeli">

  <label>Nomor WhatsApp</label>
  <input id="wa" placeholder="08xxxxxxxxxx">

  <label>Alamat Lengkap</label>
  <textarea id="alamat" rows="3"></textarea>

  <label>Catatan (opsional)</label>
  <textarea id="catatan" rows="2"></textarea>

  <button onclick="kirimWA()">Pesan via WhatsApp</button>

</div>

<script>
const p = new URLSearchParams(location.search);
const produk = p.get("produk") || "-";
const harga = p.get("harga") || "-";

document.getElementById("produk").innerText = produk;
document.getElementById("harga").innerText = harga;

function kirimWA(){
  const nama = nama.value.trim();
  const wa = document.getElementById("wa").value.trim();
  const alamat = alamat.value.trim();
  const catatan = catatan.value.trim();

  if(!nama || !wa || !alamat){
    alert("Mohon lengkapi data diri terlebih dahulu sebelum melanjutkan pemesanan.");
    return;
  }

  const pesan =
`Halo, saya ingin memesan:

Produk: ${produk}
Harga: Rp ${harga}

Nama: ${nama}
No WA: ${wa}
Alamat: ${alamat}
Catatan: ${catatan}`;

  window.open(
    `https://wa.me/62895339847320?text=${encodeURIComponent(pesan)}`,
    "_blank"
  );
}
</script>

</body>
</html>
