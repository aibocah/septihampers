<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produk Custom</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">

  <div class="header">Produk Custom</div>

  <p class="custom-desc">
    Pilih isian hampers sesuai keinginan Anda
  </p>

  <div class="custom-card">

    <div class="custom-label">Pilih Isian</div>

    <div class="custom-list">
      <label class="item">Fanta <input type="checkbox" value="5000"></label>
      <label class="item">Gula <input type="checkbox" value="7000"></label>
      <label class="item">Sirup ABC <input type="checkbox" value="12000"></label>
      <label class="item">Nektar <input type="checkbox" value="15000"></label>
      <label class="item">Kopi <input type="checkbox" value="8000"></label>
      <label class="item">Snack <input type="checkbox" value="10000"></label>
    </div>

    <!-- TOTAL -->
    <div class="price-box">
      <div class="rp">Rp</div>
      <div class="price" id="total">0</div>
      <div class="cta">Total Harga</div>
    </div>

    <div class="custom-label">Data Pembeli</div>

    <input type="text" id="nama" placeholder="Nama Lengkap">
    <br><br>

    <input type="text" id="wa" placeholder="No WhatsApp">
    <br><br>

    <textarea id="alamat" placeholder="Alamat Lengkap"></textarea>
    <br><br>

    <textarea id="catatan" placeholder="Catatan Tambahan"></textarea>

    <div class="confirm-wrap">
      <button class="confirm-btn" onclick="checkoutCustom()">
        Pesan via WhatsApp
      </button>
    </div>

  </div>

</div>

<script>
const checkboxes = document.querySelectorAll(".custom-list input");
const totalEl = document.getElementById("total");

function hitungTotal() {
  let total = 0;
  checkboxes.forEach(cb => {
    if (cb.checked) total += parseInt(cb.value);
  });
  totalEl.innerText = total.toLocaleString("id-ID");
}

checkboxes.forEach(cb => cb.addEventListener("change", hitungTotal));

function checkoutCustom() {
  let items = [];
  let total = 0;

  checkboxes.forEach(cb => {
    if (cb.checked) {
      items.push(cb.parentElement.innerText.trim());
      total += parseInt(cb.value);
    }
  });

  const nama = document.getElementById("nama").value;
  const wa = document.getElementById("wa").value;
  const alamat = document.getElementById("alamat").value;
  const catatan = document.getElementById("catatan").value;

  if (!nama || !wa || items.length === 0) {
    alert("Nama, WhatsApp, dan minimal 1 item wajib diisi");
    return;
  }

  const admin = "62895339847320"; 

  const pesan =
`Halo Admin, saya ingin pesan *Custom Hampers*:

Isi:
- ${items.join("\n- ")}

Total: Rp ${total.toLocaleString("id-ID")}

Nama: ${nama}
No WA: ${wa}
Alamat: ${alamat}
Catatan: ${catatan}`;

  window.open(
    `https://wa.me/${admin}?text=${encodeURIComponent(pesan)}`,
    "_blank"
  );
}
</script>

</body>
</html>
