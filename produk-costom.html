<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Produk Kostum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="container">

  <div class="header">Produk Kostum</div>

  <div class="custom-desc">
    Sesuaikan pilihan isian hampers sesuai keinginan Anda.<br><br>
    Kami akan menginformasikan harga terbaik melalui WhatsApp.
  </div>

  <div class="custom-card">

    <div class="custom-label">
      Pilih atau isi sesuai keinginan Anda
    </div>

    <div class="custom-list">
      <label class="item"><span>Fanta</span><input type="checkbox" value="Fanta"></label>
      <label class="item"><span>Sirup</span><input type="checkbox" value="Sirup"></label>

      <label class="item"><span>Gula</span><input type="checkbox" value="Gula"></label>
      <label class="item"><span>Snack</span><input type="checkbox" value="Snack"></label>

      <label class="item"><span>Beras</span><input type="checkbox" value="Beras"></label>
      <label class="item"><span>Monde</span><input type="checkbox" value="Monde"></label>

      <label class="item"><span>Kurma</span><input type="checkbox" value="Kurma"></label>
      <label class="item"><span>Tanggo</span><input type="checkbox" value="Tanggo"></label>

      <label class="item"><span>Madu</span><input type="checkbox" value="Madu"></label>
      <label class="item"><span>Minyak Goreng</span><input type="checkbox" value="Minyak Goreng"></label>
    </div>

    <textarea id="catatan" placeholder="Tulis permintaan khusus (opsional)"></textarea>

  </div>

  <div class="confirm-wrap">
    <button type="button" class="confirm-btn" onclick="keOrder()">
      Konfirmasi Harga
    </button>
  </div>

</div>

<script>
function keOrder(){
  const checked = document.querySelectorAll('.custom-list input:checked');
  let isian = [];

  checked.forEach(cb => isian.push(cb.value));

  const catatan = document.getElementById("catatan").value.trim();

  if(isian.length === 0 && !catatan){
    alert("Silakan pilih isian atau tuliskan permintaan Anda terlebih dahulu.");
    return;
  }

  let detail = isian.join(", ");
  if(catatan){
    detail += " | Catatan: " + catatan;
  }

  const url =
    "assets/produk/order.html"
    + "?produk=" + encodeURIComponent("Produk Kostum")
    + "&harga=" + encodeURIComponent("Menyesuaikan")
    + "&detail=" + encodeURIComponent(detail);

  window.location.href = url;
}
</script>

</body>
</html>
