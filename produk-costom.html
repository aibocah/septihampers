<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Produk Kostum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="container">

  <div class="header">
    Produk Kostum
  </div>

  <div class="custom-desc">
    sesuaikan pilihan isian hampers<br>
    anda dengan apa yang kamu mau.<br><br>
    Anda bisa tanya soal harga<br>
    Hampers dengan isian costom<br>
    kepada kami
  </div>

  <div class="custom-card">

    <div class="custom-label">
      pilih atau isi sesuai keinginan anda
    </div>

    <div class="custom-list">
      <div class="item"><span>fanta</span><input type="checkbox"></div>
      <div class="item"><span>sirup</span><input type="checkbox"></div>

      <div class="item"><span>gula</span><input type="checkbox"></div>
      <div class="item"><span>snack</span><input type="checkbox"></div>

      <div class="item"><span>bera</span><input type="checkbox"></div>
      <div class="item"><span>monde</span><input type="checkbox"></div>

      <div class="item"><span>kurma</span><input type="checkbox"></div>
      <div class="item"><span>tanggo</span><input type="checkbox"></div>

      <div class="item"><span>madu</span><input type="checkbox"></div>
      <div class="item"><span>minyak goreng</span><input type="checkbox"></div>
    </div>

    <textarea placeholder="isi keinginan anda"></textarea>

  </div>

  <div class="confirm-wrap">
    <button class="confirm-btn">
      Konfirmasi Harga
    </button>
  </div>

</div>

</body>
</html>
